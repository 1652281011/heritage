[uwsgi]

# uwsgi 启动时所使用的地址与端口

http = 127.0.0.1:50701
http-websockets = true
#protocol=http
# 指向网站目录
chdir = /var/www/xinls-dev

# python 启动程序文件
wsgi-file = manage.py

# python 程序内用以启动的 application 变量名
callable = app

# 主进程
master=True

# 进程数
processes = 4

# 线程数
threads = 8

buffer-size=65536


# 为每个工作进程设置请求数的上限。当处理的请求总数超过这个量，进程回收重启。
max-requests=10000

#设置工作进程使用虚拟内存超过多少MB就回收重启。地址空间比指定百万字节高
# reload-on-as=8000

# 如果rss内存比指定百万字节高，那么重载 8G
reload-on-rss=8000

#设置平滑的重启（直到处理完接收到的请求）的长等待时间(秒)
reload-mercy=10

# 状态检测地址
# stats = 0.0.0.0:50702



# 自动重启，只在开发时使用
# python-autoreload = 1

# 日志
logto = /var/log/uwsgi/uwsgi.log

# stats = %(chdir)/uwsgi/uwsgi.status

# pidfile = %(chdir)/uwsgi/uwsgi.pid

# 解决APSchedler任务不能执行
enable-threads = true
preload=True
lazy-apps=true
